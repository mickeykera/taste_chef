name: Mobile builds

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mobile-builds.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mobile-builds.yml'
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: mobile-builds-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter @tastechef/mobile typecheck

      - name: Build web app
        run: pnpm --filter @tastechef/mobile build

      - name: Sync Capacitor
        run: pnpm --filter @tastechef/mobile exec cap sync android

      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            artifacts/TasteChef-debug.apk
          ls -lh artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: tastechef-apk
          path: artifacts/TasteChef-debug.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure CocoaPods
        run: command -v pod >/dev/null || gem install cocoapods --no-document

      - name: Type-check
        run: pnpm --filter @tastechef/mobile typecheck

      - name: Build web app
        run: pnpm --filter @tastechef/mobile build

      - name: Sync Capacitor and install pods
        run: pnpm --filter @tastechef/mobile exec cap sync ios

      - name: Build unsigned IPA
        run: bash scripts/build-ios-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: tastechef-ipa
          path: apps/mobile/artifacts/TasteChef-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish phone downloads
    needs: [android, ios]
    if: |
      github.event_name == 'release' ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v7
        with:
          pattern: tastechef-*
          path: dist
          merge-multiple: true

      - name: List builds
        run: ls -lh dist

      - name: Update rolling prerelease
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: mobile-latest
          name: TasteChef mobile builds (latest main)
          prerelease: true
          make_latest: false
          body: |
            Builds from the latest `main` commit. This release is replaced on every push.

            ## Android
            Download `TasteChef-debug.apk`, open it on the phone, and allow
            "Install unknown apps" if Android asks. It is signed with the standard
            Android debug key, so it is for testing, not the Play Store.

            ## iPhone / iPad
            Download `TasteChef-unsigned.ipa`, then sideload it with AltStore,
            Sideloadly or Xcode. iOS will not install an unsigned IPA by tapping it,
            because Apple requires a signing certificate for direct install. A free
            Apple ID works with AltStore/Sideloadly and signs the app for 7 days.
          files: |
            dist/TasteChef-debug.apk
            dist/TasteChef-unsigned.ipa
          fail_on_unmatched_files: true

      - name: Attach builds to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/TasteChef-debug.apk
            dist/TasteChef-unsigned.ipa
          fail_on_unmatched_files: true
